# ACCEPT ALL — foot palette.
#
# Shipped instead of generated from Omarchy's template so the theme can set
# real background alpha: Hyprland only blurs behind pixels the client actually
# paints transparent, so a rule-based opacity would give glass with no frost.

[colors-dark]
alpha=0.87
alpha-mode=matching
blur=yes

foreground=E8E6DA
background=0D0D0D
selection-foreground=F2F2EC
selection-background=123A0A

cursor=0D0D0D 39FF14

regular0=0D0D0D
regular1=E06060
regular2=39FF14
regular3=FFB000
regular4=86A3BE
regular5=B295BE
regular6=6FD4B4
regular7=E8E6DA

bright0=3E4A38
bright1=EE8A8A
bright2=7CFF5E
bright3=FFC94F
bright4=A4BDD4
bright5=C9B1D2
bright6=95E8CE
bright7=FBFBF6
